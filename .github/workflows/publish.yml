name: Publish to npm
on:
  push:
    tags: ["v*.*.*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - name: Changelog entry for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # This gate already checked presence AND order, correctly, and said
          # NOTHING when it failed -- four bare commands whose only output is an
          # exit code. A guard that refuses without a reason costs the reader
          # the diagnosis on top of the failure, and it reads as the workflow
          # being broken rather than the changelog.
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::No CHANGELOG.md. Every package keeps one."
            exit 1
          fi

          if ! grep -qE "^## +\[?v?${VERSION}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}. Add one -- say what a consumer must DO -- then re-tag."
            exit 1
          fi

          FIRST=$(grep -E '^## ' CHANGELOG.md | grep -viE '^## +\[?unreleased\]?' | head -1)

          if ! printf '%s' "$FIRST" | grep -qE "^## +\[?v?${VERSION}\]?"; then
            echo "::error::CHANGELOG.md has an entry for ${VERSION}, but it is NOT the first version heading."
            echo "::error::Top of file is: ${FIRST}"
            echo "::error::Move this release above the older entries, then re-tag."
            exit 1
          fi
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false
      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx -y npm@11.18.0 publish --provenance --access public

      # ---------------------------------------------------------------------
      # Publish the GitHub release, from the changelog entry gated above.
      # ---------------------------------------------------------------------
      #
      # A package can be fully published and completely invisible on GitHub.
      # `fancy-flow-php` had v0.11.0 showing as "Latest" while the registry
      # served v0.42.0 -- 31 minors of shipped work, and anyone evaluating the
      # package by browsing it saw a project that looked abandoned. Reported by
      # a consumer, who noticed `gh release list` disagreed with what they had
      # installed.
      #
      # That was fixed in the PHP workflow and only there. Measured 2026-09-30:
      # of the TypeScript repos publishing to npm, **every one had zero GitHub
      # releases** -- react-fancy on 5.30.0 with 100 tags and an empty Releases
      # page. The PHP workflow's own comment names this failure mode: a fix
      # applied only where the problem was noticed is a fix the rest of the
      # estate never receives, and nothing reports that. It was happening in
      # the other direction.
      #
      # This runs AFTER the npm publish, deliberately. The npm tarball is
      # immutable, so a release announcing a version that failed to publish
      # could not be walked back; sequenced this way the release only ever
      # describes something a consumer can actually install.
      #
      # Automated rather than added to the ship checklist on purpose -- a
      # manual step is what produced the gap. The notes come from CHANGELOG.md,
      # so there is no second description to drift from the first.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
            exit 0
          fi

          # The section for this version, up to the next `## ` heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, v)) { found = 1 }; next }
            found { print }
          ' CHANGELOG.md > notes.md

          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          echo "Published release $GITHUB_REF_NAME."
